  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: oai-amf
    namespace: duranta
  - kind: ServiceAccount
    name: oai-ausf
    namespace: duranta
  - kind: ServiceAccount
    name: oai-nrf
    namespace: duranta
  - kind: ServiceAccount
    name: oai-smf
    namespace: duranta
  - kind: ServiceAccount
    name: oai-udm
    namespace: duranta
  - kind: ServiceAccount
    name: oai-udr
