# Source: oai-du/templates/deployment.yaml
# SPDX-License-Identifier: MIT

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-du
  labels:
    app: oai-du
    helm.sh/chart: oai-du-2.4.0
    app.kubernetes.io/name: oai-du
    app.kubernetes.io/instance: oai-du
    app.kubernetes.io/version: "develop"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-du
      app.kubernetes.io/instance: oai-du
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-du
        app.kubernetes.io/instance: oai-du
        app: oai-du
    spec:
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      serviceAccountName: oai-du
      terminationGracePeriodSeconds: 5
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      initContainers:
        - name: wait-for-cu
          image: docker.io/oaisoftwarealliance/oai-tcpdump-init:alpine-3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - until ncat -zv 192.168.27.57 38472 --sctp ; do echo waiting for cu or cucp to start; sleep 1; done
          resources:
            requests: { cpu: "1m", memory: "50Mi" }
            limits:   { cpu: "1m", memory: "50Mi" }
        - name: config-patcher
          image: docker.io/mikefarah/yq:4.47.2
          command: [ "sh", "-c" ]
          args:
            - |
              set -e
              echo "Resolving hostnames and patching config..."
              cp /tmp/config/config.yaml /tmp/config_patch/gnb.yaml
              for i in $(seq 1 $MAX_RETRIES); do
                echo "$CU_HOST" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$' && { export CU_IP="$CU_HOST"; break; }
                CU_IP=$(getent hosts "$CU_HOST" | awk '{print $1}')
                if [ -n "$CU_IP" ]; then
                  echo "Resolved CU_IP=$CU_IP"
                  export CU_IP
                  break
                fi
                echo "[$i/$MAX_RETRIES] Waiting for $CU_HOST to resolve..."
                sleep $SLEEP_TIME
              done

              if [ -z "$CU_IP" ]; then
                echo "ERROR: Unable to resolve $CU_HOST after $((MAX_RETRIES*SLEEP_TIME)) seconds"
                exit 1
              fi

              export F1C_IP=$(ip -f inet addr show $F1C_IF_NAME | grep -o "inet [0-9]*\.[0-9]*\.[0-9]*\.[0-9]*" | grep -o "[0-9]*\.[0-9]*\.[0-9]*\.[0-9]*");
              export F1U_IP=$(ip -f inet addr show $F1U_IF_NAME | grep -o "inet [0-9]*\.[0-9]*\.[0-9]*\.[0-9]*" | grep -o "[0-9]*\.[0-9]*\.[0-9]*\.[0-9]*");

              yq -i '
                .Active_gNBs[0] = strenv(DU_NAME) |
                .gNBs[0].gNB_name = strenv(DU_NAME) |
                .gNBs[0].tracking_area_code = strenv(TAC) |
                .gNBs[0].plmn_list = strenv(PLMN_LIST) |
                .gNBs[].plmn_list |= (from_yaml) |
                del(.e2_agent) |
                .MACRLCs[0].local_n_address = strenv(F1C_IP) |
                .MACRLCs[0].local_n_address_f1u = strenv(F1U_IP) |
                .MACRLCs[0].remote_n_address = strenv(CU_IP) 
              ' /tmp/config_patch/gnb.yaml
              cat /tmp/config_patch/gnb.yaml
          env:
            - name: DU_NAME
              value: "duranta-du"
            ## For resolving the hostname
            - name: MAX_RETRIES
              value: "10"
            - name: SLEEP_TIME
              value: "2"
            - name: F1C_IF_NAME
              value: 'eth0'
            - name: F1U_IF_NAME
              value: 'eth0'
            - name: CU_HOST
              value: "192.168.27.57"
            - name: TAC
              value: "1"
            - name: PLMN_LIST
              value: |
              
                - mcc: "001"
                  mnc: "01"
                  mnc_length: "2"
                  snssaiList:
                  - sd: "0xffffff"
                    sst: "1"
          volumeMounts:
            - name: shared-data
              mountPath: /tmp/config_patch
            - name: configuration
              mountPath: /tmp/config
          resources:
            requests: { cpu: "1m", memory: "50Mi" }
            limits:   { cpu: "1m", memory: "50Mi" }
      containers:
        - name: du
          image: "docker.io/oaisoftwarealliance/oai-gnb:2026.w05"
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
              - SYS_NICE
              drop:
              - ALL
          volumeMounts:
            - name: shared-data
              mountPath: /opt/oai-gnb/etc
          env:
          - name: TZ
            value: America/New_York
          - name: USE_ADDITIONAL_OPTIONS
            value: -E --rfsim --rfsimulator.serveraddr server --log_config.global_log_options level,nocolor,time
          - name: OAI_GDBSTACKS
            value: "1"
          ports:
          - containerPort: 38472
            name: f1c
            protocol: SCTP
          - containerPort: 2153
            name: f1u
            protocol: UDP

      volumes:
        - name: configuration
          configMap:
            name: oai-du-configmap
        - name: shared-data
          emptyDir: {}
---
