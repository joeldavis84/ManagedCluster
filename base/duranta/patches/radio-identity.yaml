apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-du
spec:
  template:
    spec:
      containers:
        - name: du
          env:
            - name: GNB_ID
              valueFrom:
                configMapKeyRef:
                  name: duranta-radio-identity
                  key: gnb-id

            - name: GNB_DU_ID
              valueFrom:
                configMapKeyRef:
                  name: duranta-radio-identity
                  key: gnb-du-id

            - name: NR_CELL_ID
              valueFrom:
                configMapKeyRef:
                  name: duranta-radio-identity
                  key: nr-cell-id

            - name: PCI
              valueFrom:
                configMapKeyRef:
                  name: duranta-radio-identity
                  key: pci

            - name: USE_ADDITIONAL_OPTIONS
              value: >-
                -E
                --rfsim
                --rfsimulator.serveraddr server
                --log_config.global_log_options level,nocolor,time
                --gNBs.[0].gNB_ID $(GNB_ID)
                --gNBs.[0].gNB_DU_ID $(GNB_DU_ID)
                --gNBs.[0].nr_cellid $(NR_CELL_ID)
                --gNBs.[0].servingCellConfigCommon.[0].physCellId $(PCI)
