  labels:
    app: oai-nr-ue
rules:
- apiGroups:
  - security.openshift.io
  resourceNames:
  - privileged
  resources:
  - securitycontextconstraints
  verbs:
  - use
---
# Source: oai-nr-ue/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oai-nr-ue-duranta-binding
  labels:
    app: oai-nr-ue
subjects:
- kind: ServiceAccount
  name: oai-nr-ue
  namespace: duranta
roleRef:
