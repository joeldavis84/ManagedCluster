# Source: oai-nr-ue/templates/deployment.yaml
# SPDX-License-Identifier: MIT

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-nr-ue
  labels:
    helm.sh/chart: oai-nr-ue-2.4.0
    app.kubernetes.io/name: oai-nr-ue
    app.kubernetes.io/instance: oai-nr-ue
    app.kubernetes.io/version: "develop"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-nr-ue
      app.kubernetes.io/instance: oai-nr-ue
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-nr-ue
        app.kubernetes.io/instance: oai-nr-ue
        app: oai-nr-ue
    spec:
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      containers:
      - name: nr-ue
        image: "docker.io/oaisoftwarealliance/oai-nr-ue:2025.w50"
        imagePullPolicy: IfNotPresent
        securityContext:
            capabilities:
              add:
              - NET_ADMIN
              - NET_RAW
              - SYS_NICE
              - IPC_LOCK
              drop:
              - ALL
            privileged: true
        volumeMounts:
          - mountPath: /opt/oai-nr-ue/etc
            name: configuration
          - name: dev-net-tun
            mountPath: /dev/net/tun
          # USRP B210/B200 Mini
        command: [ "/bin/bash", "-c" ]
        args:
          - RFSIM_IP_ADDRESS=$(getent hosts $RFSIM_HOST | awk '{print $1}');
            RFSIM_IP_ADDRESS=$(if [[ $RFSIM_IP_ADDRESS ]]; then echo $RFSIM_IP_ADDRESS; else echo $RFSIM_HOST;fi);
              exec /opt/oai-nr-ue/bin/nr-uesoftmodem -O /opt/oai-nr-ue/etc/nr-ue.conf $USE_ADDITIONAL_OPTIONS --rfsimulator.serveraddr $RFSIM_IP_ADDRESS;
        env:
          - name: TZ
            value: "America/New_York"
          - name: USE_ADDITIONAL_OPTIONS
            value: "-E --rfsim -r 106 --numerology 1 -C 3319680000 --log_config.global_log_options level,nocolor,time"
          - name: RFSIM_HOST
            value: oai-ran
          - name: OAI_GDBSTACKS
            value: "1"
      volumes:
      - configMap:
          name: oai-nr-ue-configmap
        name: configuration
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccountName: oai-nr-ue
      terminationGracePeriodSeconds: 5
---
