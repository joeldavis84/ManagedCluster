apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: demo-linux-mcp-server
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostNetwork: false
allowHostPID: false
allowHostIPC: false
allowHostPorts: false
readOnlyRootFilesystem: false
runAsUser:
  type: MustRunAs
  uid: 1001
seLinuxContext:
  type: MustRunAs
  seLinuxOptions:
    level: "s0"
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
requiredDropCapabilities:
  - ALL
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
