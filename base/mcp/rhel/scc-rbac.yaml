apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linux-mcp-server-scc
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - demo-linux-mcp-server
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linux-mcp-server-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: linux-mcp-server-scc
subjects:
  - kind: ServiceAccount
    name: linux-mcp-server
    namespace: demo-rhel-mcp
