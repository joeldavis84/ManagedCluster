---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ptp-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/name: ptp-mcp-server
  name: ptp-mcp-server
  namespace: openshift-ptp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ptp-mcp-server
  template:
    metadata:
      labels:
        app: ptp-mcp-server
        app.kubernetes.io/name: ptp-mcp-server
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: PTP_MCP_PORT
          value: "8080"
        - name: PTP_MCP_HOST
          value: 0.0.0.0
        - name: PTP_NAMESPACE
          value: openshift-ptp
        - name: PTP_DAEMON_NAME
          value: linuxptp-daemon
        - name: PTP_CONTAINER_NAME
          value: linuxptp-daemon-container
        image: quay.io/jodavis/ptp-mcp-server:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
        name: ptp-mcp-server
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: ptp-mcp-server
