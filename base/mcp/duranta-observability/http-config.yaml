apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-mcp-http
  namespace: duranta-observability
data:
  http-config.yaml: |
    authorization:
      type: Bearer
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /etc/prometheus-mcp/service-ca/service-ca.crt
